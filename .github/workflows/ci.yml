name: Connector checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: canvas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U canvas -d canvas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONNECTOR_TEST_POSTGRES_URL: postgresql://canvas:synthetic-ci-only@127.0.0.1:5432/canvas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.lock -e ./packages/canvas-py -e ./packages/canvas-mcp-v2 -e '.[dev,postgres]'
      - run: python -m pytest -q
      - run: python scripts/check_protocol.py
      - run: python scripts/release_check.py --build
      - run: python -m pip check
      - run: python scripts/build_mcpb.py
      - run: python scripts/build_plugins.py
      - run: docker build -t canvas-connector:verify .
      - run: python scripts/check_container.py
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-connector-distributions
          path: |
            dist/*-source.zip
            dist/*.mcpb
            dist/*-plugins.zip
