name: Connector checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: canvas
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: canvas
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U canvas -d canvas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CONNECTOR_TEST_POSTGRES_URL: postgresql://canvas:synthetic-ci-only@127.0.0.1:5432/canvas
      CONNECTOR_BENCHMARK_POSTGRES_URL: postgresql://canvas:synthetic-ci-only@127.0.0.1:5432/canvas
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.lock -e ./packages/canvas-py -e ./packages/canvas-mcp-v2 -e '.[dev,postgres]'
      - run: python -m pytest -q
      - run: python scripts/check_protocol.py
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.25"
      - name: Install the isolated personal tunnel facade
        run: uv --no-config sync --python 3.12 --project packages/canvas-tunnel --locked
      - name: Verify both tunnel protocol lifecycles
        run: |
          CANVAS_CORE_PYTHON="$(python -c 'import sys; print(sys.executable)')" \
            uv --no-config run --project packages/canvas-tunnel --locked --no-sync \
            pytest -c packages/canvas-tunnel/pyproject.toml packages/canvas-tunnel/tests
      - run: python scripts/release_check.py --build
      - run: python -m pip check
      - run: python scripts/build_mcpb.py
      - run: python scripts/build_plugins.py
      - name: Install Cloudflare runtime dependencies
        run: npm ci --ignore-scripts --prefix cloudflare
      - name: Verify Cloudflare storage and gateway
        run: npm test --prefix cloudflare
      - run: python scripts/benchmark_hosted.py --database postgres --workers 2 --concurrency 32 --requests 1000 --output dist/benchmark-postgres.json
      - name: Verify personal multi-app workload
        run: python scripts/benchmark_personal.py --requests 1000 --output dist/benchmark-personal.json
      - run: docker build -t canvas-connector:verify .
      - run: python scripts/check_container.py
      - run: python scripts/check_container.py --mode personal
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-connector-distributions
          path: |
            dist/*-source.zip
            dist/*.mcpb
            dist/*-plugins.zip
            dist/benchmark-*.json
