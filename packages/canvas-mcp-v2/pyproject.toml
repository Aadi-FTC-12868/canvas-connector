[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-mcp-v2"
version = "0.2.0"
description = "MCP server exposing canvas-py to Claude Code, a 24/7 agent, or any MCP client."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Aadi Chandraya" },
]

dependencies = [
    "mcp==1.27.0",
    "canvas-py",
    "python-dotenv>=1.0",
    "uvicorn>=0.27",
    "starlette>=0.37",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
canvas-mcp-v2 = "canvas_mcp_v2.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
