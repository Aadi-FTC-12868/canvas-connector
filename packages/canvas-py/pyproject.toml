[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-py"
version = "0.2.0"
description = "Typed Canvas API client with navigation and document extraction."
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Aadi Chandraya" },
]

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "pypdf>=6.17,<7",
    "defusedxml>=0.7.1,<1",
    "Pillow>=12.3,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]
