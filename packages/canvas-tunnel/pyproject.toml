[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "canvas-connector-tunnel"
version = "0.1.0"
description = "Isolated personal stdio compatibility facade for Canvas Connector"
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
dependencies = ["mcp==2.3.0"]

[project.scripts]
canvas-connector-tunnel = "canvas_tunnel.__main__:main"

[dependency-groups]
dev = ["pytest==9.2.0", "pytest-asyncio==1.4.1.post1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = true
cache-keys = [{ file = "pyproject.toml" }, { file = "README.md" }, { file = "src/**/*.py" }, { git = { commit = true } }]

[tool.ruff]
line-length = 100
target-version = "py312"

